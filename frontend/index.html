<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Password Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fafbfb 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: clamp(1.8em, 5vw, 2.5em);
        }
        .slider-group {
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
            font-size: 1.1em;
        }
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #e9ecef;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 25px;
            width: 25px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        #length-value {
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            margin-top: 10px;
        }
        .checkboxes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .checkbox-item:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }
        .checkbox-item input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.3);
            accent-color: #667eea;
        }
        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }
        .result {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 20px;
            text-align: center;
            display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .password {
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: clamp(1.5em, 6vw, 2.5em);
            word-break: break-all;
            letter-spacing: 2px;
            margin: 20px 0;
            padding: 20px;
            background: white;
            border-radius: 12px;
            border: 2px solid #e9ecef;
        }
        .strength {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1em;
            margin: 15px 0;
        }
        .strength.strong { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .strength.moderate { background: #fff3cd; color: #856404; border: 2px solid #ffeaa7; }
        .strength.weak { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
        .copy-btn {
            margin-top: 15px;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Password Generator</h1>
        
        <div class="slider-group">
            <label>Password Length: <span id="length-value">8</span></label>
            <input type="range" id="length" min="4" max="13" value="8">
        </div>
        
        <div class="checkboxes">
            <label class="checkbox-item">
                <input type="checkbox" id="upper" checked> Uppercase (A-Z)
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="lower" checked> Lowercase (a-z)
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="numbers" checked> Numbers (0-9)
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="symbols" checked> Symbols (!@#$%)
            </label>
        </div>
        
        <button class="generate-btn" onclick="generatePassword()">Generate Password</button>
        
        <div class="result" id="result">
            <div class="password" id="password"></div>
            <div class="strength" id="strength"></div>
            <button class="copy-btn" onclick="copyPassword()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        const lengthSlider = document.getElementById('length');
        const lengthValue = document.getElementById('length-value');
        
        lengthSlider.addEventListener('input', function() {
            lengthValue.textContent = this.value;
        });
        
        async function generatePassword() {
            const length = parseInt(document.getElementById('length').value);
            const upper = document.getElementById('upper').checked;
            const lower = document.getElementById('lower').checked;
            const numbers = document.getElementById('numbers').checked;
            const symbols = document.getElementById('symbols').checked;
            
            if (!upper && !lower && !numbers && !symbols) {
                alert('No character types selected!');
                return;
            }

            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ length, upper, lower, numbers, symbols })
            });
            
            const data = await response.json();
            
            // Check for error from server
            if (data.error) {
                alert(data.error);
                return;
            }
            
            // Check if password is too weak
            if (data.tooWeak) {
                alert('Password too weak! Generate another password.');
                return;
            }
            
            document.getElementById('password').textContent = data.password;
            const strengthEl = document.getElementById('strength');
            strengthEl.textContent = 'Strength: ' + data.strength;
            strengthEl.className = 'strength ' + data.strength;
            
            const resultEl = document.getElementById('result');
            resultEl.style.display = 'block';
            resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        function copyPassword() {
            const password = document.getElementById('password').textContent;
            navigator.clipboard.writeText(password).then(() => {
                alert('Password copied to clipboard!');
            });
        }
    </script>
</body>
</html>
